services:
  app:
    image: 85216048m/nirvaankar:latest
    container_name: nirvaankar-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ap-south-1
      NIRVAANKAR_S3_BUCKET: nirvaankar
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:-}
      CUSTOMER_FRONTEND_BASE_URL: ${CUSTOMER_FRONTEND_BASE_URL:-http://localhost:5173}
      SELLER_FRONTEND_BASE_URL: ${SELLER_FRONTEND_BASE_URL:-http://localhost:5174/seller}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-}
      GST_VERIFICATION_API_KEY: ${GST_VERIFICATION_API_KEY:-}
      GST_VERIFICATION_BASE_URL: ${GST_VERIFICATION_BASE_URL:-}
      BANK_VERIFICATION_API_KEY: ${BANK_VERIFICATION_API_KEY:-}
      BANK_VERIFICATION_BASE_URL: ${BANK_VERIFICATION_BASE_URL:-}
      NIRVAANKAR_DATA_ENCRYPTION_KEY: ${NIRVAANKAR_DATA_ENCRYPTION_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    container_name: nirvaankar-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --transaction-isolation=READ-COMMITTED
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nirvaankar-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data: