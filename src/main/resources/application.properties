whatsapp.order-confirmation-template=${WHATSAPP_ORDER_CONFIRMATION_TEMPLATE:order_confirmation}
whatsapp.order-packed-template=${WHATSAPP_ORDER_PACKED_TEMPLATE:order_packed_status}
whatsapp.order-shipped-template=${WHATSAPP_ORDER_SHIPPED_TEMPLATE:order_shipped_status}
whatsapp.order-out-for-delivery-template=${WHATSAPP_ORDER_OUT_FOR_DELIVERY_TEMPLATE:order_out_for_delivery}
whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:en}