whatsapp.api.token=${WHATSAPP_API_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:1359483567241160}
whatsapp.graph-api-version=${WHATSAPP_GRAPH_API_VERSION:v25.0}
