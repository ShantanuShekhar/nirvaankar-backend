# ---------------------------------------------------------------------------
#  Nirvaankar Marketplace - base configuration
#
#  THREAD BUDGET (see common/config/AsyncConfig.java):
#    outbox      max 8   |  notification max 6  |  searchIndex max 4
#    audit       max 4   |  webhookRetry max 4  |  report      max 2
#    Of these, the pools that touch the database are: outbox, audit,
#    searchIndex, webhookRetry  ->  8 + 4 + 4 + 4 = 20 worker threads.
#    mail pool (SMTP) and sms pool (Fast2SMS) do not touch the DB.
#    Tomcat request threads that touch the DB: bounded at 50 by
#    server.tomcat.threads.max, but they queue on Hikari rather than
#    deadlocking because no request holds two connections at once.
#    Hikari maximum-pool-size is therefore 30: enough that the 20 async
#    workers can never starve each other, with headroom for requests.
#    If you add an executor, update this comment AND the Hikari size.
# ---------------------------------------------------------------------------
spring:
  application:
    name: nirvaankar-marketplace
  config:
    import:
      - optional:file:.secrets/razorpay.yml
      - optional:file:.secrets/aws.yml
      - optional:file:.secrets/whatsapp.properties
      - optional:file:.secrets/encryption.yml
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:mysql://localhost:3306/nirvaankar?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true
    username: root
    password: mysql
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 10000
      max-lifetime: 1200000
      pool-name: nirvaankar-cp

  jpa:
    open-in-view: false              # MANDATORY. Never true.
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; Hibernate must not mutate it.
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true
        generate_statistics: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      # Short on purpose: login must not hang if Redis is dead. Fail the
      # cache call, then authenticate against MySQL.
      timeout: 250ms
      connect-timeout: 250ms
      lettuce:
        shutdown-timeout: 100ms

  # Gmail SMTP (free tier ~500/day). Credentials via env only — never commit.
  # Swap EmailService implementation to AWS SES later without touching auth logic.
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${MAIL_USERNAME:care.nirvaankar@gmail.com}
    password: ${MAIL_APP_PASSWORD:gozh cihc eijc zzrq}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-stacktrace: never
  tomcat:
    threads:
      max: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

nirvaankar:
  brand:
    name: Nirvaankar
    tagline: Handmade. Natural. Nothing else.
    support-email: care@nirvaankar.com
  security:
    jwt:
      issuer: https://api.nirvaankar.com
      access-token-ttl: PT15M
      # RSA keys. Leave blank in dev -> an ephemeral keypair is generated at
      # startup (tokens die with the process, which is what you want locally).
      private-key-pem: ${NIRVAANKAR_JWT_PRIVATE_KEY:}
      public-key-pem: ${NIRVAANKAR_JWT_PUBLIC_KEY:}
    refresh-token:
      ttl: P30D
    password:
      bcrypt-strength: 12
  otp:
    ttl: PT5M
    max-attempts: 5
    length: 6
    resend-cooldown: PT1M
    # dev only: echoes the OTP in the response so you can test without an SMS gateway
    expose-in-response: false
  idempotency:
    ttl: PT24H
  rate-limit:
    otp-request-per-hour: 5
    login-attempts-per-15min: 10
    password-reset-per-hour: 3
  registration:
    # Time allowed to finish the registration form after email OTP verify
    verified-ttl: PT30M
  password-reset:
    ttl: PT24H
    resend-cooldown: PT1M
  frontend:
    # Used to build password-reset links. Set per environment on EC2.
    customer-base-url: ${CUSTOMER_FRONTEND_BASE_URL:http://localhost:5173}
    seller-base-url: ${SELLER_FRONTEND_BASE_URL:http://localhost:5174/seller}
  shipping:
    # Schema has no rate table; these are the only shipping rules.
    flat-rate-minor: 100          # ₹49.00
    free-above-minor: 99900        # free shipping at ₹999.00 subtotal
    currency: INR
    origin-state: Maharashtra      # used to choose CGST+SGST vs IGST
  payment:
    gateway: ${NIRVAANKAR_PAYMENT_GATEWAY:razorpay}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    reservation-ttl: PT15M
  catalog:
    # ₹1,00,000.00 default ceiling for selling price (paise)
    max-selling-price-minor: 10000000
    # Selling price cannot be more than this % below MRP
    max-discount-percent-from-mrp: 70
    max-images-per-product: 5
    max-image-bytes: 5242880
  # Fast2SMS Quick SMS (route=q). Only API key is required — set via env, never commit.
  fast2sms:
    api-key: ${FAST2SMS_API_KEY:0hZbSHfuvA6qBJrgtjawTiyLmCQzdIexUKoOcn24YXlNVPGRs5T0svSiwgAQRaZYXVFDbC7JGyMEfeW6}
    api-url: ${FAST2SMS_API_URL:https://www.fast2sms.com}
    route: q
  # Seller KYC — GST via gstinapi.in; bank Reverse Penny Drop (generic HTTP)
  verification:
    gst:
      api-key: ${GST_VERIFICATION_API_KEY:gak_92a5b6e0483c414695bc668937d83d5e}
      base-url: ${GST_VERIFICATION_BASE_URL:https://www.gstinapi.in/v1}
      connect-timeout-ms: ${GST_VERIFICATION_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${GST_VERIFICATION_READ_TIMEOUT_MS:15000}
    bank:
      api-key: ${BANK_VERIFICATION_API_KEY:}
      base-url: ${BANK_VERIFICATION_BASE_URL:https://api.example-bank-provider.com/v1}
      initiate-path: ${BANK_VERIFICATION_INITIATE_PATH:/bank/reverse-penny-drop}
      webhook-secret: ${BANK_VERIFICATION_WEBHOOK_SECRET:}
  s3:
    region: ${AWS_REGION:ap-south-1}
    bucket: ${NIRVAANKAR_S3_BUCKET:nirvaankar}
    prefix: products/
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    max-file-bytes: 5242880
  whatsapp:
    # Meta webhook verify token and app secret. Override via env in every
    # non-local environment. The local default exists only so GET /webhook
    # can be subscribed through a tunnel such as loca.lt.
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:my_secret_whatsapp_token_123}
    app-secret: ${WHATSAPP_APP_SECRET:}

logging:
  level:
    com.nirvaankar: INFO
    org.hibernate.SQL: WARN
