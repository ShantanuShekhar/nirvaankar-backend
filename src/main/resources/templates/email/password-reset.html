<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{brand}} password reset</title>
</head>
<body style="margin:0;padding:24px;background:#ffffff;font-family:Arial,Helvetica,sans-serif;color:#222222;font-size:15px;line-height:1.5;">
  <p style="margin:0 0 12px;">{{brand}}</p>
  <p style="margin:0 0 16px;">We received a request to reset your password. This link expires in {{hours}} hours and can be used only once.</p>
  <p style="margin:0 0 16px;">
    <a href="{{resetLink}}" style="color:#1a73e8;">Reset your password</a>
  </p>
  <p style="margin:0 0 16px;font-size:12px;color:#555555;word-break:break-all;">Or paste this link into your browser:<br />{{resetLink}}</p>
  <p style="margin:0 0 16px;color:#555555;">If you did not request this, ignore this email.</p>
  <p style="margin:0;font-size:12px;color:#777777;">Help: {{support}}</p>
</body>
</html>
