<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{brand}} email code</title>
</head>
<body style="margin:0;padding:24px;background:#ffffff;font-family:Arial,Helvetica,sans-serif;color:#222222;font-size:15px;line-height:1.5;">
  <p style="margin:0 0 12px;">{{brand}}</p>
  <p style="margin:0 0 16px;">Your email verification code is:</p>
  <p style="margin:0 0 16px;font-size:28px;letter-spacing:4px;font-weight:bold;font-family:Consolas,Monaco,monospace;">{{otp}}</p>
  <p style="margin:0 0 16px;">This code expires in {{minutes}} minutes.</p>
  <p style="margin:0 0 16px;color:#555555;">If you did not request this, ignore this email.</p>
  <p style="margin:0;font-size:12px;color:#777777;">Help: {{support}}</p>
</body>
</html>
