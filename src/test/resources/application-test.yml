spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: true
        query.fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 250ms
      connect-timeout: 250ms

nirvaankar:
  otp:
    expose-in-response: true    # tests need the code; never enabled outside test/dev
    max-attempts: 5
  payment:
    gateway: simulated
    key-id: ""
    key-secret: ""
    webhook-secret: ""
  security:
    password:
      bcrypt-strength: 4        # keeps the suite fast; production stays at 12
  s3:
    access-key: ""
    secret-key: ""
  whatsapp:
    webhook-verify-token: my_secret_whatsapp_token_123
    app-secret: test_whatsapp_app_secret

whatsapp:
  api:
    token: ""

logging:
  level:
    org.hibernate.SQL: debug
